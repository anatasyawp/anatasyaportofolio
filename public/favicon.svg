<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" />
      <stop offset="45%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" />
  
  <!-- Top Rim Highlight -->
  <rect x="18" y="18" width="476" height="476" rx="126" fill="none" stroke="url(#innerGlow)" stroke-width="4" />

  <!-- Monogram Glyph "A" -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M156 364 L256 148 L356 364" stroke-width="46" />
    <path d="M192 288 L320 288" stroke-width="42" />
  </g>
  <!-- Accent Dot in Apex -->
  <circle cx="256" cy="226" r="24" fill="#FECDD3" />
</svg>

